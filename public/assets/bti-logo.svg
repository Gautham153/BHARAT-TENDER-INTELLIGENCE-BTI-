<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" fill="none">
  <defs>
    <linearGradient id="saffronArc" x1="100" y1="200" x2="600" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF671F" />
      <stop offset="60%" stop-color="#FF7A2F" />
      <stop offset="100%" stop-color="#FFA050" />
    </linearGradient>
    <linearGradient id="greenArc" x1="700" y1="400" x2="200" y2="750" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#046A38" />
      <stop offset="60%" stop-color="#058A4A" />
      <stop offset="100%" stop-color="#024D28" />
    </linearGradient>
    <linearGradient id="iSwoopOrange" x1="620" y1="320" x2="720" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF671F" />
      <stop offset="100%" stop-color="#FF8E3D" />
    </linearGradient>
    <linearGradient id="iSwoopGreen" x1="630" y1="380" x2="720" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#058A4A" />
      <stop offset="100%" stop-color="#046A38" />
    </linearGradient>
    <linearGradient id="roadGrad" x1="400" y1="580" x2="450" y2="740" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#002B49" />
      <stop offset="100%" stop-color="#00182B" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <circle cx="400" cy="400" r="395" fill="#FFFFFF" />

  <!-- Circular Tricolor Frame Arcs -->
  <!-- Upper Left Saffron Arc -->
  <path d="M 120 400 A 300 300 0 0 1 500 130" stroke="url(#saffronArc)" stroke-width="44" stroke-linecap="round" fill="none" />
  
  <!-- Lower Green Arc -->
  <path d="M 680 400 A 300 300 0 0 1 150 560" stroke="url(#greenArc)" stroke-width="44" stroke-linecap="round" fill="none" />

  <!-- Ashoka Chakra at Top Center -->
  <g transform="translate(400, 240)">
    <circle cx="0" cy="0" r="82" stroke="#002B49" stroke-width="8" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="14" fill="#002B49" />
    <!-- 24 spokes -->
    <g stroke="#002B49" stroke-width="3">
      <line x1="0" y1="-80" x2="0" y2="80" />
      <line x1="-80" y1="0" x2="80" y2="0" />
      <line x1="-56.5" y1="-56.5" x2="56.5" y2="56.5" />
      <line x1="-56.5" y1="56.5" x2="56.5" y2="-56.5" />
      <line x1="-20.7" y1="-77.3" x2="20.7" y2="77.3" />
      <line x1="20.7" y1="-77.3" x2="-20.7" y2="77.3" />
      <line x1="-77.3" y1="-20.7" x2="77.3" y2="20.7" />
      <line x1="77.3" y1="-20.7" x2="-77.3" y2="20.7" />
      <line x1="-40" y1="-69.3" x2="40" y2="69.3" />
      <line x1="40" y1="-69.3" x2="-40" y2="69.3" />
      <line x1="-69.3" y1="-40" x2="69.3" y2="40" />
      <line x1="69.3" y1="-40" x2="-69.3" y2="40" />
    </g>
  </g>

  <!-- Big Bold Navy Blue "BTI" Lettering -->
  <!-- "B" -->
  <path d="M 110 340 L 330 340 A 55 55 0 0 1 385 395 L 385 415 A 50 50 0 0 1 340 460 L 385 490 A 65 65 0 0 1 385 540 L 385 550 A 60 60 0 0 1 325 610 L 110 610 Z M 195 400 L 195 440 L 290 440 A 20 20 0 0 0 310 420 A 20 20 0 0 0 290 400 Z M 195 500 L 195 550 L 295 550 A 25 25 0 0 0 320 525 A 25 25 0 0 0 295 500 Z" fill="#002B49" />

  <!-- "T" -->
  <path d="M 390 340 L 635 340 L 635 410 L 550 410 L 550 610 L 475 610 L 475 410 L 390 410 Z" fill="#002B49" />

  <!-- "I" -->
  <path d="M 645 400 L 720 400 L 720 610 L 645 610 Z" fill="#002B49" />
  <!-- "I" Dynamic Swoop Accent (Saffron upper, Green lower) -->
  <path d="M 645 395 C 680 340 730 320 735 320 L 735 365 C 690 375 660 395 645 425 Z" fill="url(#iSwoopOrange)" />
  <path d="M 720 400 C 730 420 735 450 735 490 L 720 490 Z" fill="url(#iSwoopGreen)" />

  <!-- Infrastructure & Smart City Elements Under BT -->
  <!-- Left: Cable Stayed Bridge -->
  <g stroke="#002B49" fill="#002B49">
    <!-- Bridge Pylons -->
    <polygon points="260,610 266,540 274,540 280,610" />
    <!-- Stay Cables -->
    <line x1="270" y1="545" x2="160" y2="670" stroke="#002B49" stroke-width="3" />
    <line x1="270" y1="555" x2="185" y2="670" stroke="#002B49" stroke-width="3" />
    <line x1="270" y1="565" x2="210" y2="670" stroke="#002B49" stroke-width="3" />
    <line x1="270" y1="575" x2="235" y2="670" stroke="#002B49" stroke-width="3" />
    <line x1="270" y1="545" x2="380" y2="670" stroke="#002B49" stroke-width="3" />
    <line x1="270" y1="555" x2="355" y2="670" stroke="#002B49" stroke-width="3" />
    <line x1="270" y1="565" x2="330" y2="670" stroke="#002B49" stroke-width="3" />
    <line x1="270" y1="575" x2="305" y2="670" stroke="#002B49" stroke-width="3" />
  </g>

  <!-- Center: Skyline Buildings -->
  <g fill="#64748B">
    <rect x="360" y="580" width="22" height="90" />
    <rect x="385" y="550" width="28" height="120" />
    <rect x="418" y="520" width="34" height="150" fill="#002B49" />
    <polygon points="418,520 435,490 452,520" fill="#002B49" />
    <rect x="456" y="560" width="30" height="110" />
    <rect x="490" y="590" width="26" height="80" />
  </g>
  <!-- Windows -->
  <g fill="#FFFFFF" opacity="0.8">
    <rect x="424" y="535" width="4" height="6" />
    <rect x="432" y="535" width="4" height="6" />
    <rect x="440" y="535" width="4" height="6" />
    <rect x="424" y="550" width="4" height="6" />
    <rect x="432" y="550" width="4" height="6" />
    <rect x="440" y="550" width="4" height="6" />
    <rect x="424" y="565" width="4" height="6" />
    <rect x="432" y="565" width="4" height="6" />
    <rect x="440" y="565" width="4" height="6" />
  </g>

  <!-- Right: Construction Tower Crane -->
  <g stroke="#002B49" stroke-width="4" fill="none">
    <!-- Vertical Mast with X-bracing -->
    <line x1="560" y1="670" x2="560" y2="530" />
    <line x1="580" y1="670" x2="580" y2="530" />
    <line x1="560" y1="650" x2="580" y2="670" stroke-width="2" />
    <line x1="580" y1="650" x2="560" y2="670" stroke-width="2" />
    <line x1="560" y1="610" x2="580" y2="630" stroke-width="2" />
    <line x1="580" y1="610" x2="560" y2="630" stroke-width="2" />
    <line x1="560" y1="570" x2="580" y2="590" stroke-width="2" />
    <line x1="580" y1="570" x2="560" y2="590" stroke-width="2" />
    <!-- Horizontal Jib & Counter-Jib -->
    <line x1="520" y1="540" x2="630" y2="540" stroke-width="5" />
    <!-- Apex Tower & Tie Cables -->
    <line x1="560" y1="540" x2="570" y2="510" stroke-width="3" />
    <line x1="580" y1="540" x2="570" y2="510" stroke-width="3" />
    <line x1="570" y1="510" x2="530" y2="540" stroke-width="2" />
    <line x1="570" y1="510" x2="615" y2="540" stroke-width="2" />
    <!-- Hoist Line & Hook -->
    <line x1="615" y1="540" x2="615" y2="580" stroke-width="2" stroke-dasharray="2 2" />
    <circle cx="615" cy="584" r="4" fill="#002B49" />
  </g>

  <!-- Foreground: Curved Modern Multi-Lane Highway -->
  <path d="M 230 670 Q 420 620 660 670 L 640 760 Q 430 710 190 750 Z" fill="url(#roadGrad)" />
  <!-- Center Dashed Lines -->
  <path d="M 270 695 Q 430 655 620 705" stroke="#FFFFFF" stroke-width="6" stroke-dasharray="16 14" fill="none" />
</svg>